<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tren AIFA-Buenavista En Vivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html, body { height: 100dvh; width: 100vw; overflow: hidden; background: #0f172a; color: #f8fafc; }
        #app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        #header { background: #0f172a; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; z-index: 1000; }
        .logo-title { font-size: 15px; font-weight: bold; color: #fff; }
        .logo-sub { font-size: 11px; color: #94a3b8; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #eab308; display: inline-block; margin-right: 4px; }
        .status-dot.active { background: #22c55e; }
        #map { flex: 1; width: 100%; z-index: 1; }
        
        /* Panel elevado a 35px para que nunca quede tapado */
        #panel { 
            position: absolute; 
            bottom: 35px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 24px); 
            max-width: 440px; 
            background: rgba(15, 23, 42, 0.96); 
            backdrop-filter: blur(8px);
            border-radius: 14px; 
            padding: 10px; 
            z-index: 1000; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 40dvh;
            display: flex;
            flex-direction: column;
        }
        
        .btn-group { display: flex; gap: 4px; background: #1e293b; padding: 3px; border-radius: 8px; margin-bottom: 6px; }
        .btn { flex: 1; padding: 7px 2px; border: none; background: transparent; color: #94a3b8; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn.active { background: #2563eb; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        select, input { width: 100%; padding: 7px 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 11px; }
        .card { background: #1e293b; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 11px; }
        
        .main-btn { 
            width: 100%; 
            padding: 9px; 
            border: none; 
            border-radius: 8px; 
            background: #16a34a; 
            color: white; 
            font-weight: bold; 
            margin-top: 6px; 
            font-size: 12px; 
            cursor: pointer; 
        }
        .main-btn.sharing { background: #dc2626; }
        .train-icon { background: #2563eb; border: 2px solid #fff; border-radius: 50%; color: white; text-align: center; line-height: 26px; font-size: 13px; }

        #feed-container {
            overflow-y: auto;
            max-height: 150px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .report-item {
            background: #1e293b;
            border-left: 3px solid #2563eb;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .report-msg { color: #f8fafc; font-weight: 500; }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="header">
            <div>
                <div class="logo-title">🚆 Tren AIFA-Buenavista</div>
                <div class="logo-sub">Comunidad & Monitoreo</div>
            </div>
            <div style="font-size: 11px; display: flex; align-items: center;">
                <span class="status-dot" id="dot"></span> <span id="st-txt">Manual</span>
            </div>
        </div>
        <div id="map"></div>
        <div id="panel">
            <div class="btn-group">
                <button class="btn active" id="b1" onclick="sm('passenger')">Mapa</button>
                <button class="btn" id="b2" onclick="sm('report')">Pasar Tren</button>
                <button class="btn" id="b3" onclick="sm('feed')">📢 Reportes</button>
                <button class="btn" id="b4" onclick="sm('onboard')">GPS</button>
            </div>

            <div id="sec-rep" class="grid" style="display:none;">
                <select id="sel-st" onchange="sendReport()">
                    <option value="">Seleccionar estación...</option>
                </select>
                <select id="sel-dir" onchange="sendReport()">
                    <option value="Hacia AIFA">Hacia AIFA</option>
                    <option value="Hacia Buenavista">Hacia Buenavista</option>
                </select>
            </div>

            <div id="sec-feed" style="display:none;">
                <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                    <input type="text" id="inp-msg" placeholder="Ej: Retraso de 10 min en Buenavista..." />
                    <button style="background: #2563eb; color: white; border: none; padding: 0 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer;" onclick="sendIncidence()">Enviar</button>
                </div>
                <div id="feed-container">
                    <div style="text-align: center; color: #94a3b8; font-size: 11px;">Cargando reportes...</div>
                </div>
            </div>

            <div class="card" id="card-status">
                <div><span>Ubicación: </span><b id="lbl-loc">Cargando...</b></div>
                <div><b id="lbl-dir">Hacia AIFA</b></div>
            </div>

            <button class="main-btn" id="btn-gps" style="display:none;" onclick="toggleGps()">Activar GPS en Vivo</button>
        </div>
    </div>

    <script>
        var fbConfig = { databaseURL: "https://tren-aifa-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(fbConfig);
        var db = firebase.database();
        var statusRef = db.ref('tren_status');
        var feedRef = db.ref('community_reports');

        var stList = [
            { name: "Buenavista", lat: 19.4461, lng: -99.1531 },
            { name: "Fortuna", lat: 19.4893, lng: -99.1714 },
            { name: "Tlalnepantla", lat: 19.5385, lng: -99.1895 },
            { name: "San Rafael", lat: 19.5630, lng: -99.1913 },
            { name: "Lechería", lat: 19.5986, lng: -99.1830 },
            { name: "Cueyamil", lat: 19.6135, lng: -99.1480 },
            { name: "La Loma", lat: 19.6200, lng: -99.1380 },
            { name: "Teyahualco", lat: 19.6480, lng: -99.1120 },
            { name: "Prados Sur", lat: 19.6880, lng: -99.0770 },
            { name: "Nextlalpan", lat: 19.7085, lng: -99.0580 },
            { name: "Xaltocan", lat: 19.7290, lng: -99.0305 },
            { name: "AIFA", lat: 19.7510, lng: -99.0180 }
        ];

        var track = [
            [19.4461, -99.1531], [19.4580, -99.1590], [19.4770, -99.1710],
            [19.4893, -99.1714], [19.5150, -99.1770], [19.5385, -99.1895],
            [19.5630, -99.1913], [19.5986, -99.1830], [19.6055, -99.1630],
            [19.6135, -99.1480], [19.6200, -99.1380], [19.6480, -99.1120],
            [19.6880, -99.0770], [19.7085, -99.0580], [19.7290, -99.0305],
            [19.7510, -99.0180]
        ];

        var sel = document.getElementById('sel-st');
        stList.forEach(function(s, i) {
            var o = document.createElement('option');
            o.value = i; o.innerText = s.name;
            sel.appendChild(o);
        });

        var map = L.map('map', { zoomControl: false }).setView([19.6000, -99.1200], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        L.polyline(track, { color: '#2563eb', weight: 5, opacity: 0.9 }).addTo(map);

        stList.forEach(function(s) {
            L.circleMarker([s.lat, s.lng], { radius: 5, fillColor: '#fff', color: '#2563eb', weight: 2.5, fillOpacity: 1 }).addTo(map);
        });

        var tIcon = L.divIcon({ className: 'train-icon', html: '🚆', iconSize: [26, 26], iconAnchor: [13, 13] });
        var marker = L.marker([stList[0].lat, stList[0].lng], { icon: tIcon }).addTo(map);

        var watchId = null, isLive = false;

        statusRef.on('value', function(snap) {
            var d = snap.val();
            if (d) {
                marker.setLatLng([d.lat, d.lng]);
                map.panTo([d.lat, d.lng]);
                document.getElementById('lbl-loc').innerText = d.locationName;
                document.getElementById('lbl-dir').innerText = d.direction;
                document.getElementById('st-txt').innerText = d.isGps ? "GPS Vivo" : "Manual";
                document.getElementById('dot').className = 'status-dot' + (d.isGps ? ' active' : '');
            }
        });

        feedRef.limitToLast(15).on('value', function(snap) {
            var container = document.getElementById('feed-container');
            container.innerHTML = '';
            var data = snap.val();
            if (data) {
                var items = Object.values(data).reverse();
                items.forEach(function(item) {
                    var div = document.createElement('div');
                    div.className = 'report-item';
                    div.innerHTML = '<div class="report-header"><span>Usuario</span><span>' + item.time + '</span></div><div class="report-msg">' + item.text + '</div>';
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 11px;">No hay reportes recientes.</div>';
            }
        });

        function sendReport() {
            var idx = sel.value;
            var dir = document.getElementById('sel-dir').value;
            if (idx !== "") {
                var s = stList[idx];
                statusRef.set({ lat: s.lat, lng: s.lng, locationName: s.name, direction: dir, isGps: false });
            }
        }

        function sendIncidence() {
            var inp = document.getElementById('inp-msg');
            var txt = inp.value.trim();
            if (txt !== "") {
                var now = new Date();
                var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                feedRef.push({ text: txt, time: timeStr });
                inp.value = '';
            }
        }

        function toggleGps() {
            var btn = document.getElementById('btn-gps');
            if (!isLive) {
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(function(pos) {
                        isLive = true;
                        var dir = document.getElementById('sel-dir').value;
                        statusRef.set({ lat: pos.coords.latitude, lng: pos.coords.longitude, locationName: "En trayecto (GPS)", direction: dir, isGps: true });
                        btn.className = 'main-btn sharing';
                        btn.innerText = '🔴 Detener GPS';
                    }, function(err) { alert("Error GPS: " + err.message); }, { enableHighAccuracy: true });
                }
            } else {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                isLive = false;
                btn.className = 'main-btn';
                btn.innerText = 'Activar GPS en Vivo';
            }
        }

        function sm(m) {
            document.getElementById('b1').className = 'btn' + (m==='passenger'?' active':'');
            document.getElementById('b2').className = 'btn' + (m==='report'?' active':'');
            document.getElementById('b3').className = 'btn' + (m==='feed'?' active':'');
            document.getElementById('b4').className = 'btn' + (m==='onboard'?' active':'');

            document.getElementById('sec-rep').style.display = (m==='report') ? 'grid' : 'none';
            document.getElementById('sec-feed').style.display = (m==='feed') ? 'block' : 'none';
            document.getElementById('btn-gps').style.display = (m==='onboard') ? 'block' : 'none';
        }
    </script>
</body>
</html>
