        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html, body { height: 100dvh; width: 100vw; overflow: hidden; background: #0f172a; color: #f8fafc; }
        #app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        #header { background: #0f172a; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; z-index: 1000; }
        .logo-title { font-size: 15px; font-weight: bold; color: #fff; }
        .logo-sub { font-size: 11px; color: #94a3b8; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 4px; }
        #map { flex: 1; width: 100%; z-index: 1; }
        
        #panel { 
            position: absolute; 
            bottom: 35px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 24px); 
            max-width: 440px; 
            background: rgba(15, 23, 42, 0.96); 
            backdrop-filter: blur(8px);
            border-radius: 14px; 
            padding: 10px; 
            z-index: 1000; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 40dvh;
            display: flex;
            flex-direction: column;
        }
        
        .btn-group { display: flex; gap: 4px; background: #1e293b; padding: 3px; border-radius: 8px; margin-bottom: 6px; }
        .btn { flex: 1; padding: 7px 2px; border: none; background: transparent; color: #94a3b8; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn.active { background: #2563eb; color: #fff; }
        .card { background: #1e293b; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 11px; }
        
        .main-btn { 
            width: 100%; 
            padding: 9px; 
            border: none; 
            border-radius: 8px; 
            background: #16a34a; 
            color: white; 
            font-weight: bold; 
            margin-top: 6px; 
            font-size: 12px; 
            cursor: pointer; 
        }
        .train-icon { background: #2563eb; border: 2px solid #fff; border-radius: 50%; color: white; text-align: center; line-height: 26px; font-size: 13px; box-shadow: 0 0 10px rgba(37,99,235,0.8); }

        #feed-container {
            overflow-y: auto;
            max-height: 150px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .report-item {
            background: #1e293b;
            border-left: 3px solid #22c55e;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .report-msg { color: #f8fafc; font-weight: 500; }

        .station-popup { font-family: system-ui, -apple-system, sans-serif; text-align: center; }
        .station-popup h4 { font-size: 13px; color: #0f172a; margin-bottom: 6px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .popup-btn { 
            display: block; 
            width: 100%; 
            padding: 6px; 
            margin: 4px 0; 
            border: none; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white;
        }
        .btn-train-aifa { background: #16a34a; }
        .btn-train-bv { background: #2563eb; }
    </style>

        var map = L.map('map', { zoomControl: false }).setView([19.6000, -99.1400], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Sombra de la vía y línea principal verde neón
        L.polyline(track, { color: '#052e16', weight: 9, opacity: 0.6, lineCap: 'round', lineJoin: 'round' }).addTo(map);
        L.polyline(track, { color: '#22c55e', weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(map);

        // Colocar estaciones en el mapa
        stList.forEach(function(s, index) {
            var circle = L.circleMarker([s.lat, s.lng], { 
                radius: 6, fillColor: '#ffffff', color: '#1e293b', weight: 2, opacity: 1, fillOpacity: 1 
            }).addTo(map);

            circle.on('click', function() {
                openStationPopup(circle, s, index);
            });
        });

        function openStationPopup(markerObj, s, index) {
            var popupHtml = `<div class="station-popup">
                <h4>Estación ${s.name}</h4>
                <p style="font-size:10px; color:#64748b; margin-bottom:6px;">Confirmar paso de tren:</p>
                <button class="popup-btn btn-train-aifa" onclick="reportTrainFromStation(${index}, 'Hacia AIFA')">🚆 Pasó hacia AIFA</button>
                <button class="popup-btn btn-train-bv" onclick="reportTrainFromStation(${index}, 'Hacia Buenavista')">🚆 Pasó hacia Buenavista</button>
            </div>`;
            markerObj.bindPopup(popupHtml).openPopup();
        }

        var trainMarkers = {};

        // Sincronización en tiempo real con Firebase: Muestra el tren al instante de hacer clic
        trainsRef.on('value', function(snap) {
            var data = snap.val() || {};
            var activeKeys = Object.keys(data);
            document.getElementById('lbl-count').innerText = activeKeys.length;

            activeKeys.forEach(function(id) {
                var t = data[id];
                if (!trainMarkers[id]) {
                    var tIcon = L.divIcon({ className: 'train-icon', html: '🚆', iconSize: [26, 26], iconAnchor: [13, 13] });
                    trainMarkers[id] = L.marker([t.lat, t.lng], { icon: tIcon }).addTo(map);
                } else {
                    trainMarkers[id].setLatLng([t.lat, t.lng]);
                }
            });

            Object.keys(trainMarkers).forEach(function(id) {
                if (!data[id]) {
                    map.removeLayer(trainMarkers[id]);
                    delete trainMarkers[id];
                }
            });
        });

        function reportTrainFromStation(idx, dir) {
            var s = stList[idx];
            var trainId = "tren_" + idx + "_" + (dir === 'Hacia AIFA' ? 'A' : 'B');
            
            // Publica el tren de manera fija en la coordenada de la estación seleccionada
            trainsRef.child(trainId).set({
                id: trainId,
                lat: s.lat,
                lng: s.lng,
                direction: dir,
                timestamp: Date.now()
            });

            map.closePopup();

            // Inserta el reporte detallado en el feed comunitario de la app
            var now = new Date();
            var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            feedRef.push({ text: `🚆 Tren reportado saliendo de estación ${s.name} (${dir})`, time: timeStr });
        }

        feedRef.limitToLast(15).on('value', function(snap) {
            var container = document.getElementById('feed-container');
            container.innerHTML = '';
            var data = snap.val();
            if (data) {
                var items = Object.values(data).reverse();
                items.forEach(function(item) {
                    var div = document.createElement('div');
                    div.className = 'report-item';
                    div.innerHTML = '<div class="report-header"><span>Reporte de Comunidad</span><span>' + item.time + '</span></div><div class="report-msg">' + item.text + '</div>';
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 11px;">No hay reportes recientes.</div>';
            }
        });

        function sendIncidence() {
            var inp = document.getElementById('inp-msg');
            var txt = inp.value.trim();
            if (txt !== "") {
                var now = new Date();
                var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                feedRef.push({ text: txt, time: timeStr });
                inp.value = '';
            }
        }

        function sm(m) {
            document.getElementById('b1').className = 'btn' + (m==='passenger'?' active':'');
            document.getElementById('b3').className = 'btn' + (m==='feed'?' active':'');
            document.getElementById('b4').className = 'btn' + (m==='onboard'?' active':'');

            document.getElementById('sec-feed').style.display = (m==='feed') ? 'block' : 'none';
            document.getElementById('btn-gps').style.display = (m==='onboard') ? 'block' : 'none';
        }
