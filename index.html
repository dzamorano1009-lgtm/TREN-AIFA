    <script>
        // Configuración de Firebase
        const firebaseConfig = { databaseURL: "https://tren-aifa-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('tren_status');

        // 1. ESTACIONES OFICIALES DEL RAMAL BUENAVISTA - AIFA
        const stations = [
            { name: "Buenavista", lat: 19.4461, lng: -99.1531 },
            { name: "Fortuna", lat: 19.4893, lng: -99.1714 },
            { name: "Tlalnepantla", lat: 19.5385, lng: -99.1895 },
            { name: "San Rafael", lat: 19.5630, lng: -99.1913 },
            { name: "Lechería (Bifurcación)", lat: 19.5986, lng: -99.1830 },
            { name: "Cueyamil", lat: 19.6105, lng: -99.1550 },
            { name: "Teyahualco", lat: 19.6450, lng: -99.1180 },
            { name: "Prados Sur", lat: 19.6750, lng: -99.0880 },
            { name: "Nextlalpan", lat: 19.7090, lng: -99.0550 },
            { name: "Xaltocan", lat: 19.7320, lng: -99.0270 },
            { name: "AIFA", lat: 19.7510, lng: -99.0180 }
        ];

        // 2. TRAZO EXACTO DE LA VÍA FÉRREA (Sigue las vías reales y curvas en el mapa)
        const exactRailwayPath = [
            [19.4461, -99.1531], // Buenavista
            [19.4893, -99.1714], // Fortuna
            [19.5385, -99.1895], // Tlalnepantla
            [19.5630, -99.1913], // San Rafael
            [19.5986, -99.1830], // Lechería (Desvío al este)
            [19.6015, -99.1720], // Curva salida Lechería
            [19.6070, -99.1600], // Tramo Tultitlán norte
            [19.6105, -99.1550], // Estación Cueyamil
            [19.6230, -99.1390], // Tramo Tultepec
            [19.6450, -99.1180], // Estación Teyahualco
            [19.6600, -99.1020], // San Pablo de las Salinas
            [19.6750, -99.0880], // Estación Prados Sur
            [19.6920, -99.0710], // Tramo Jaltenco
            [19.7090, -99.0550], // Estación Nextlalpan
            [19.7220, -99.0380], // Entrada a Xaltocan
            [19.7320, -99.0270], // Estación Xaltocan
            [19.7420, -99.0200], // Curva de acceso al Aeropuerto
            [19.7510, -99.0180]  // Terminal AIFA
        ];

        // Llenar selector de estaciones
        const selectEst = document.getElementById('select-station');
        stations.forEach((s, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = s.name;
            selectEst.appendChild(opt);
        });

        // Inicializar Mapa centrado en la ruta
        const map = L.map('map', { zoomControl: false }).setView([19.6300, -99.1200], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        // DIBUJAR VÍA FÉRREA EXACTA (Trazo azul sobre el derecho de vía real)
        L.polyline(exactRailwayPath, { color: '#2563eb', weight: 5, opacity: 0.85 }).addTo(map);

        // Marcadores de las Estaciones
        stations.forEach(s => {
            L.circleMarker([s.lat, s.lng], { radius: 6, fillColor: '#ffffff', color: '#2563eb', weight: 2.5, fillOpacity: 1 })
             .addTo(map)
             .bindPopup(`<b>Estación: ${s.name}</b>`);
        });

        // Icono del Tren
        const trainIcon = L.divIcon({ className: 'custom-train-icon', html: '🚆', iconSize: [32, 32], iconAnchor: [16, 16] });
        let trainMarker = L.marker([stations[6].lat, stations[6].lng], { icon: trainIcon }).addTo(map);

        let watchId = null;
        let isSharing = false;

        // Escuchar cambios en la Base de Datos Firebase
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                trainMarker.setLatLng([data.lat, data.lng]);
                map.panTo([data.lat, data.lng]);
                document.getElementById('train-location').innerText = data.locationName;
                document.getElementById('train-direction').innerText = data.direction;
                document.getElementById('system-status').innerText = data.isGps ? "GPS en Vivo" : "Reporte Manual";
                document.getElementById('status-dot').classList.toggle('active', data.isGps);
            }
        });

        // Enviar Reporte Manual
        function sendStationReport() {
            const idx = selectEst.value;
            const dir = document.getElementById('select-direction').value;
            if (idx !== "") {
                const st = stations[idx];
                dbRef.set({
                    lat: st.lat,
                    lng: st.lng,
                    locationName: `En estación ${st.name}`,
                    direction: dir,
                    isGps: false,
                    updatedAt: Date.now()
                });
            }
        }

        // Transmisión GPS en Vivo
        function toggleGpsTracking() {
            const btn = document.getElementById('main-action-btn');
            if (!isSharing) {
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition((pos) => {
                        isSharing = true;
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const dir = document.getElementById('select-direction').value;

                        dbRef.set({
                            lat: lat,
                            lng: lng,
                            locationName: "GPS en vivo (A bordo)",
                            direction: dir,
                            isGps: true,
                            updatedAt: Date.now()
                        });

                        btn.classList.add('active-sharing');
                        btn.innerText = '🔴 Detener Transmisión GPS';
                    }, (err) => {
                        alert("Error al obtener señal GPS: " + err.message);
                    }, { enableHighAccuracy: true });
                }
            } else {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                isSharing = false;
                btn.classList.remove('active-sharing');
                btn.innerText = 'Activar Rastreo GPS en Vivo';
            }
        }

        function setMode(mode) {
            document.getElementById('btn-mode-passenger').classList.toggle('active', mode === 'passenger');
            document.getElementById('btn-mode-report').classList.toggle('active', mode === 'report');
            document.getElementById('btn-mode-onboard').classList.toggle('active', mode === 'onboard');
            document.getElementById('section-report').style.display = (mode === 'report') ? 'grid' : 'none';
            document.getElementById('main-action-btn').style.display = (mode === 'onboard') ? 'block' : 'none';
        }
            </script>
