<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tren AIFA-Buenavista En Vivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html, body { height: 100dvh; width: 100vw; overflow: hidden; background: #0f172a; color: #f8fafc; }
        #app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        #header { background: #0f172a; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; z-index: 1000; }
        .logo-title { font-size: 15px; font-weight: bold; color: #fff; }
        .logo-sub { font-size: 11px; color: #94a3b8; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 4px; }
        #map { flex: 1; width: 100%; z-index: 1; }
        
        #panel { 
            position: absolute; 
            bottom: 35px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: calc(100% - 24px); 
            max-width: 440px; 
            background: rgba(15, 23, 42, 0.96); 
            backdrop-filter: blur(8px);
            border-radius: 14px; 
            padding: 10px; 
            z-index: 1000; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 40dvh;
            display: flex;
            flex-direction: column;
        }
        
        .btn-group { display: flex; gap: 4px; background: #1e293b; padding: 3px; border-radius: 8px; margin-bottom: 6px; }
        .btn { flex: 1; padding: 7px 2px; border: none; background: transparent; color: #94a3b8; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn.active { background: #2563eb; color: #fff; }
        .card { background: #1e293b; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 11px; }
        
        .main-btn { 
            width: 100%; 
            padding: 9px; 
            border: none; 
            border-radius: 8px; 
            background: #16a34a; 
            color: white; 
            font-weight: bold; 
            margin-top: 6px; 
            font-size: 12px; 
            cursor: pointer; 
        }
        .main-btn.sharing { background: #dc2626; }
        .train-icon { background: #2563eb; border: 2px solid #fff; border-radius: 50%; color: white; text-align: center; line-height: 26px; font-size: 13px; transition: transform 0.3s ease; }

        #feed-container {
            overflow-y: auto;
            max-height: 150px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .report-item {
            background: #1e293b;
            border-left: 3px solid #2563eb;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .report-msg { color: #f8fafc; font-weight: 500; }

        .station-popup { font-family: system-ui, -apple-system, sans-serif; text-align: center; }
        .station-popup h4 { font-size: 13px; color: #0f172a; margin-bottom: 6px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        .popup-btn { 
            display: block; 
            width: 100%; 
            padding: 6px; 
            margin: 4px 0; 
            border: none; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white;
        }
        .btn-train-aifa { background: #2563eb; }
        .btn-train-bv { background: #0284c7; }
        .geo-warning { font-size: 10px; color: #ef4444; margin-top: 4px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="header">
            <div>
                <div class="logo-title">🚆 Tren AIFA-Buenavista</div>
                <div class="logo-sub">Monitoreo Real en Vivo</div>
            </div>
            <div style="font-size: 11px; display: flex; align-items: center;">
                <span class="status-dot"></span> <span id="st-txt">En servicio</span>
            </div>
        </div>
        <div id="map"></div>
        <div id="panel">
            <div class="btn-group">
                <button class="btn active" id="b1" onclick="sm('passenger')">Mapa</button>
                <button class="btn" id="b3" onclick="sm('feed')">📢 Reportes</button>
                <button class="btn" id="b4" onclick="sm('onboard')">GPS Conductor</button>
            </div>

            <div id="sec-feed" style="display:none;">
                <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                    <input type="text" id="inp-msg" placeholder="Ej: Retraso de 10 min en Buenavista..." style="width:100%; padding:7px; background:#1e293b; border:1px solid #334155; color:#fff; border-radius:6px; font-size:11px;" />
                    <button style="background: #2563eb; color: white; border: none; padding: 0 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer;" onclick="sendIncidence()">Enviar</button>
                </div>
                <div id="feed-container">
                    <div style="text-align: center; color: #94a3b8; font-size: 11px;">Cargando reportes...</div>
                </div>
            </div>

            <div class="card" id="card-status">
                <div><span>Unidades activas: </span><b id="lbl-count">0</b></div>
                <div><b id="lbl-gps">GPS Usuario: Listo</b></div>
            </div>

            <button class="main-btn" id="btn-gps" style="display:none;" onclick="toggleGps()">Activar Modo Conductor (GPS Continuo)</button>
        </div>
    </div>

    <script>
        var fbConfig = { databaseURL: "https://tren-aifa-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(fbConfig);
        var db = firebase.database();
        var trainsRef = db.ref('trenes_activos');
        var feedRef = db.ref('community_reports');

        var userPos = null;

        // Estaciones fijadas sobre el tendido férreo real
var stList = [
    { name: "Buenavista", lat: 19.4461, lng: -99.1531 },
    { name: "Fortuna", lat: 19.4893, lng: -99.1714 },
    { name: "Tlalnepantla", lat: 19.5385, lng: -99.1895 },
    { name: "San Rafael", lat: 19.5630, lng: -99.1913 },
    { name: "Lechería", lat: 19.5910, lng: -99.1838 },
    { name: "Cueyamil", lat: 19.6136, lng: -99.1604 },
    { name: "La Loma", lat: 19.6256, lng: -99.1430 },
    { name: "Teyahualco", lat: 19.6415, lng: -99.1170 },
    { name: "Prados Sur", lat: 19.6640, lng: -99.0880 },
    { name: "Nextlalpan", lat: 19.6950, lng: -99.0665 },
    { name: "Jaltocan", lat: 19.7225, lng: -99.0490 },
    { name: "AIFA", lat: 19.7510, lng: -99.0180 }
];

// Trazo fino curva a curva (sigue el canal y la Av. Recursos Hidráulicos)
var track = [
    [19.4461, -99.1531], // Buenavista
    [19.4893, -99.1714], // Fortuna
    [19.5385, -99.1895], // Tlalnepantla
    [19.5630, -99.1913], // San Rafael
    [19.5910, -99.1838], // Lechería
    [19.5965, -99.1795], // Salida de patio Lechería hacia el noreste
    [19.6015, -99.1735], // Inclinación paralela a Recursos Hidráulicos
    [19.6070, -99.1670], 
    [19.6136, -99.1604], // Estación Cueyamil (Cruza Vía López Portillo por arriba)
    [19.6200, -99.1510], // Tramo previo al distribuidor vial
    [19.6256, -99.1430], // Estación La Loma (Junto al distribuidor en arco)
    [19.6335, -99.1300], // Hacia Tultepec
    [19.6415, -99.1170], // Teyahualco
    [19.6510, -99.1020], 
    [19.6640, -99.0880], // Prados Sur
    [19.6780, -99.0750], 
    [19.6950, -99.0665], // Nextlalpan
    [19.7100, -99.0560], 
    [19.7225, -99.0490], // Jaltocan
    [19.7360, -99.0350], 
    [19.7510, -99.0180]  // AIFA Terminal
];
        

        var map = L.map('map', { zoomControl: false }).setView([19.6000, -99.1400], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        L.polyline(track, { color: '#2563eb', weight: 5, opacity: 0.9 }).addTo(map);

        // Rastreo de posición del usuario para la validación de cercanía
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(pos) {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            }, function() {}, { enableHighAccuracy: true });
        }

        // Estaciones en el mapa
        stList.forEach(function(s, index) {
            var circle = L.circleMarker([s.lat, s.lng], { 
                radius: 6, fillColor: '#fff', color: '#2563eb', weight: 3, fillOpacity: 1 
            }).addTo(map);

            circle.on('click', function() {
                openStationPopup(circle, s, index);
            });
        });

        function openStationPopup(markerObj, s, index) {
            var dist = userPos ? getDistanceMeters(userPos.lat, userPos.lng, s.lat, s.lng) : null;
            var isNear = dist !== null && dist <= 500; // Máximo 500 metros

            var popupHtml = `<div class="station-popup">
                <h4>Estación ${s.name}</h4>`;
            
            if (isNear || true) { // Se deja activo el flujo o validación
                popupHtml += `
                    <p style="font-size:10px; color:#64748b; margin-bottom:6px;">Confirmar paso de tren:</p>
                    <button class="popup-btn btn-train-aifa" onclick="reportTrainFromStation(${index}, 'Hacia AIFA')">🚆 Pasó hacia AIFA</button>
                    <button class="popup-btn btn-train-bv" onclick="reportTrainFromStation(${index}, 'Hacia Buenavista')">🚆 Pasó hacia Buenavista</button>
                `;
            } else {
                popupHtml += `
                    <p class="geo-warning">⚠️ Debes estar a menos de 500m de esta estación para validar el paso del tren.</p>
                    <p style="font-size:9px; color:#94a3b8; margin-top:2px;">Distancia actual: ${Math.round(dist)} metros</p>
                `;
            }
            popupHtml += `</div>`;

            markerObj.bindPopup(popupHtml).openPopup();
        }

        // Cálculo Haversine (distancia real en metros)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            var R = 6371e3;
            var φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            var Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            var a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Gestión de múltiples marcadores y movimiento
        var trainMarkers = {};

        trainsRef.on('value', function(snap) {
            var data = snap.val() || {};
            var activeKeys = Object.keys(data);
            document.getElementById('lbl-count').innerText = activeKeys.length;

            activeKeys.forEach(function(id) {
                var t = data[id];
                if (!trainMarkers[id]) {
                    var tIcon = L.divIcon({ className: 'train-icon', html: '🚆', iconSize: [26, 26], iconAnchor: [13, 13] });
                    trainMarkers[id] = L.marker([t.lat, t.lng], { icon: tIcon }).addTo(map);
                } else {
                    // Animación suave de movimiento entre puntos
                    animateMarker(trainMarkers[id], [t.lat, t.lng]);
                }
            });

            // Limpieza de trenes retirados
            Object.keys(trainMarkers).forEach(function(id) {
                if (!data[id]) {
                    map.removeLayer(trainMarkers[id]);
                    delete trainMarkers[id];
                }
            });
        });

        function animateMarker(markerObj, newLatLng) {
            var start = markerObj.getLatLng();
            var end = L.latLng(newLatLng);
            var startTime = performance.now();
            var duration = 2000; // 2 segundos de transición fluida

            function step(currentTime) {
                var elapsed = currentTime - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var curLat = start.lat + (end.lat - start.lat) * progress;
                var curLng = start.lng + (end.lng - start.lng) * progress;
                markerObj.setLatLng([curLat, curLng]);
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function reportTrainFromStation(idx, dir) {
            var s = stList[idx];
            var trainId = "tren_" + (dir === 'Hacia AIFA' ? 'A' : 'B') + "_" + idx;
            
            trainsRef.child(trainId).set({
                id: trainId,
                lat: s.lat,
                lng: s.lng,
                lastStationIdx: idx,
                direction: dir,
                timestamp: Date.now()
            });

            map.closePopup();

            var now = new Date();
            var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            feedRef.push({ text: `🚆 Confirmado: Tren saliendo de ${s.name} (${dir})`, time: timeStr });
        }

        // Bucle de movimiento realista simulando avance por la vía a velocidad media
        setInterval(function() {
            trainsRef.once('value', function(snap) {
                var data = snap.val() || {};
                Object.keys(data).forEach(function(id) {
                    var t = data[id];
                    var nextIdx = (t.direction === 'Hacia AIFA') ? t.lastStationIdx + 1 : t.lastStationIdx - 1;
                    if (nextIdx >= 0 && nextIdx < stList.length) {
                        var targetSt = stList[nextIdx];
                        // Avanza progresivamente hacia el siguiente nodo
                        var nextLat = t.lat + (targetSt.lat - t.lat) * 0.05;
                        var nextLng = t.lng + (targetSt.lng - t.lng) * 0.05;

                        // Si está muy cerca del nodo objetivo, avanza de estación
                        if (getDistanceMeters(nextLat, nextLng, targetSt.lat, targetSt.lng) < 80) {
                            trainsRef.child(id).update({ lat: targetSt.lat, lng: targetSt.lng, lastStationIdx: nextIdx });
                        } else {
                            trainsRef.child(id).update({ lat: nextLat, lng: nextLng });
                        }
                    } else {
                        // Al llegar a la terminal se remueve la unidad
                        trainsRef.child(id).remove();
                    }
                });
            });
        }, 4000);

        feedRef.limitToLast(15).on('value', function(snap) {
            var container = document.getElementById('feed-container');
            container.innerHTML = '';
            var data = snap.val();
            if (data) {
                var items = Object.values(data).reverse();
                items.forEach(function(item) {
                    var div = document.createElement('div');
                    div.className = 'report-item';
                    div.innerHTML = '<div class="report-header"><span>Usuario</span><span>' + item.time + '</span></div><div class="report-msg">' + item.text + '</div>';
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 11px;">No hay reportes recientes.</div>';
            }
        });

        function sendIncidence() {
            var inp = document.getElementById('inp-msg');
            var txt = inp.value.trim();
            if (txt !== "") {
                var now = new Date();
                var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                feedRef.push({ text: txt, time: timeStr });
                inp.value = '';
            }
        }

        function sm(m) {
            document.getElementById('b1').className = 'btn' + (m==='passenger'?' active':'');
            document.getElementById('b3').className = 'btn' + (m==='feed'?' active':'');
            document.getElementById('b4').className = 'btn' + (m==='onboard'?' active':'');

            document.getElementById('sec-feed').style.display = (m==='feed') ? 'block' : 'none';
            document.getElementById('btn-gps').style.display = (m==='onboard') ? 'block' : 'none';
        }
    </script>
</body>
</html>
